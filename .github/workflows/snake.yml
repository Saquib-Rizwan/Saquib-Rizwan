name: Generate contribution snake

on:
  schedule:
    # Rebuilds the animation once a day so it stays current.
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Saquib-Rizwan
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Publishes to an "output" branch, which is what README.md links to.
      # Keeping it off main means the generated files never clutter your history.
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
