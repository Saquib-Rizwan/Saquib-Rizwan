<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Saquib Rizwan">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="65%" stop-color="#FBBF24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <style>
    .name { font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif; font-size: 68px; font-weight: 800; letter-spacing: -2px; }
    .tag  { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace; font-size: 18px; fill: #94a3b8; }
    .kick { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; fill: #64748b; letter-spacing: 3px; }
  </style>

  <!-- top hairline sweeps across -->
  <rect x="0" y="34" width="1000" height="3" fill="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>
  </rect>

  <text x="500" y="76" text-anchor="middle" class="kick" opacity="0">
    C S   S T U D E N T   ·   F U L L - S T A C K
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
  </text>

  <text x="500" y="150" text-anchor="middle" class="name" fill="url(#nameFill)" opacity="0">
    SAQUIB RIZWAN
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.7s" fill="freeze"/>
  </text>

  <text x="500" y="192" text-anchor="middle" class="tag" opacity="0">
    I like problems that turn out to be something else.
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- three pulsing dots -->
  <g>
    <circle cx="476" cy="224" r="5" fill="#F59E0B" opacity="0.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="224" r="5" fill="#F59E0B" opacity="0.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="524" cy="224" r="5" fill="#F59E0B" opacity="0.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bottom hairline -->
  <rect x="0" y="248" width="1000" height="3" fill="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.4s" fill="freeze"/>
  </rect>
</svg>
